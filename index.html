<!doctype html>
<html lang="en-AU">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field-tool workspace — step tabs across the top, inputs in the main column, live results rail on wide screens, pass/fail bar on phones */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#18221f; --muted:#5b6862; --line:#d5ddd8; --soft:#e8eee9;
  --accent:#2f5d8c; --accent-soft:#e3ecf6; --accent-ink:#ffffff;
  --pass:#27744a; --pass-soft:#e2f2e8; --fail:#b3261e; --fail-soft:#fbe6e4; --warn:#9a5b00; --warn-soft:#fbefd9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#1a2220; --ink:#e4ebe7; --muted:#9aa9a2; --line:#2e3b37; --soft:#222c29;
  --accent:#7fa8d6; --accent-soft:#1f2c3a; --accent-ink:#0e1620;
  --pass:#6cc694; --pass-soft:#16301f; --fail:#f2877e; --fail-soft:#3a1916; --warn:#e7b35e; --warn-soft:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#1a2220; --ink:#e4ebe7; --muted:#9aa9a2; --line:#2e3b37; --soft:#222c29;
  --accent:#7fa8d6; --accent-soft:#1f2c3a; --accent-ink:#0e1620;
  --pass:#6cc694; --pass-soft:#16301f; --fail:#f2877e; --fail-soft:#3a1916; --warn:#e7b35e; --warn-soft:#352812; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 72px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand .sub{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
nav.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.steps button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px}
nav.steps button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-top:16px}
@media (min-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 340px}.rail{position:sticky;top:110px;align-self:start;max-height:calc(100vh - 130px);overflow:auto}.mbar{display:none!important}}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card > .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;max-width:70ch}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:baseline}
.chip small{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
.chip[aria-pressed="true"] small{color:var(--accent)}
.chip:disabled{cursor:default}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:7px 12px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.danger{border-color:var(--fail);background:transparent;color:var(--fail)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:flex;align-items:stretch}
.stepper input{width:100%;border-radius:0;text-align:right;font-family:var(--f-mono)}
.stepper button{border:1px solid var(--line);background:var(--soft);color:var(--ink);width:30px}
.stepper button:first-child{border-radius:var(--r) 0 0 var(--r)} .stepper button:last-child{border-radius:0 var(--r) var(--r) 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--soft);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pass{background:var(--pass-soft);color:var(--pass)} .fail{background:var(--fail-soft);color:var(--fail)} .warn{background:var(--warn-soft);color:var(--warn)} .na{background:var(--soft);color:var(--muted)}
.cell{display:flex;flex-direction:column;gap:2px;min-width:150px}
.cell .pill{align-self:flex-start}
.cell .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.rcard .top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
.flag{font-size:12px;color:var(--warn)}
.rail .card{gap:8px}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:30;font-size:13px}
.compass{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:480px}
@media (max-width:560px){.compass{grid-template-columns:repeat(4,minmax(0,1fr))}}
.compass .chip{justify-content:center;padding:4px 0;font-size:12px}
.dirgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;max-width:100%;height:auto}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:0 6px 6px 0;font-size:13px}
.ok{border-left-color:var(--pass);background:var(--pass-soft)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border:1px solid var(--fail);border-radius:6px;background:var(--fail-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:50;font-size:13px}
.report h2{margin-top:6px}
.report p{max-width:75ch}
@media (max-width:700px){header.top{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Leaflet essentials (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:#3a4440;-webkit-tap-highlight-color:transparent;font-family:var(--f-body)}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.5);border-radius:4px}.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;width:32px;height:32px;line-height:32px;display:block;text-align:center;text-decoration:none;color:#000;font:bold 18px monospace}.leaflet-bar a:first-child{border-radius:4px 4px 0 0}.leaflet-bar a:last-child{border-radius:0 0 4px 4px;border-bottom:none}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0!important;padding:0 5px;color:#333;font-size:10.5px}.leaflet-control-attribution a{color:#2f5d8c}
.leaflet-control-scale-line{border:2px solid #333;border-top:none;padding:1px 5px;font-size:11px;background:rgba(255,255,255,.85);color:#000}
.leaflet-tooltip{position:absolute;padding:2px 6px;background:#fff;color:#111;border-radius:3px;white-space:nowrap;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.gtip{background:rgba(10,14,12,.72);color:#fff;box-shadow:none}
.mapbox{height:62vh;min-height:360px;border-radius:8px;border:1px solid var(--line);position:relative;outline:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  header.top,.rail,.mbar,.noprint,nav{display:none!important}
  .card{border:0;padding:0}
  .layout{display:block}
}
</style>

<script>
'use strict';
/* ================= METHOD LIBRARY (data, not code) ================= */
const DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const LIB={
  VIC23:{id:'VIC23',name:'Vic 2023 multi-species',ver:'DEECA Animal production separation distance requirements, draft May 2023',status:'Consultation draft — not gazetted',unit:'SDCU'},
  NAT:{id:'NAT',name:'National S-factor',ver:'National Guidelines for Beef Cattle Feedlots in Australia, 3rd ed. 2012 (NSW EPA Technical Notes 2006 same structure)',status:'Current',unit:'SCU'},
  W02:{id:'W02',name:'Vic 2002 Wrigley & Dillon',ver:'Dairy Cattle Feedpad Guidelines, Goulburn Broken Catchment, 2002 — tables transcribed from Peter Best workbooks, appendices not sighted',status:'Comparison — unverified transcription',unit:'DCU'},
  FIX:{id:'FIX',name:'Fixed buffer (council / attenuation)',ver:'User-entered council policy or planning scheme attenuation distance',status:'Per project',unit:'—'}
};
const FKIND=[{k:'feedpad',l:'Feedpad'},{k:'dairy',l:'Dairy and holding yard'},{k:'barn',l:'Barn or freestall'},{k:'calf',l:'Calf shed'},{k:'other',l:'Other'}];
const STATES=[['VIC','Vic'],['NSW','NSW'],['SA','SA'],['QLD','Qld'],['WA','WA'],['TAS','Tas'],['NT','NT'],['ACT','ACT']];
function methodsFor(st){ if(st==='VIC')return['VIC23','W02','NAT']; if(st==='WA'||st==='TAS')return['FIX','NAT']; return['NAT']; }

// Vic 2023 Table 19 — SDCU by liveweight band [upper kg, dry, lactating]
const SDCU=[[50,.131,null],[75,.177,null],[100,.220,null],[125,.260,null],[150,.298,null],[175,.335,null],[200,.370,null],[225,.404,null],[250,.437,null],[275,.470,null],[300,.501,null],[325,.532,.612],[350,.563,.647],[375,.593,.682],[400,.622,.716],[425,.651,.749],[450,.680,.782],[475,.708,.814],[500,.736,.846],[525,.763,.877],[550,.790,.909],[575,.817,.939],[600,.843,.970],[625,.870,1.000],[650,.896,1.030],[675,.921,1.059],[700,.947,1.089],[725,.972,1.118],[750,.997,1.147],[Infinity,1.022,1.175]];
// National SCU (600 kg = 1)
const SCU_T=[[300,.59],[350,.67],[400,.74],[450,.81],[500,.87],[550,.94],[600,1],[650,1.06],[700,1.12],[750,1.18],[800,1.24],[850,1.3]];
// Vic 2002 DCU (550 kg = 1)
const DCU_T=[[300,.7],[350,.76],[400,.82],[450,.88],[500,.94],[550,1],[600,1.06],[650,1.12],[700,1.18],[750,1.24],[800,1.3]];

const VIC_S1=[
  {k:'shed_pond_lt25',l:'Shed or covered pen, uncovered pond, under 25% solids separation',v:1.5},
  {k:'shed_pond_gt25',l:'Shed or covered pen, uncovered pond, over 25% solids separation',v:1.3},
  {k:'feedpad',l:'Uncovered pen or feedpad',v:1.2},
  {k:'shed_nobed',l:'Shed, covered pen or shelter, no bedding',v:1.0},
  {k:'shed_covpond',l:'Shed or covered pen, covered pond',v:0.8},
  {k:'shed_bed',l:'Shed, covered pen or shelter with bedding',v:0.8},
  {k:'shed_6wk',l:'Shed, by-product removed from shed and farm every 6 weeks or less',v:0.6}];
// National S1 by stocking density (m²/SCU); rainfall <750 and >750 columns
const NAT_S1={lt750:[[11,62],[12,60],[13,57],[14,55],[15,52],[16,50],[17,47],[18,45],[19,42],[20,40]],
              gt750:[[16,62],[17,60],[18,57],[19,55],[20,52],[21,50],[22,47],[23,45],[24,42],[25,40]]};
// Wrigley & Dillon 2002 S1 at 10 / 15 / 20 m² per DCU. Duplicate "Roofed Pad Flood Washed Daily" row corrected to Weekly.
const W02_S1={
  Dirt:{'Scraped Weekly':[33,32,31],'Scraped Monthly':[36,35,34],'Scraped Annually':[39,38,37]},
  Paved:{'Scraped Weekly':[31,29,27],'Scraped Monthly':[34,33,32],'Scraped Annually':[37,36,35],'Flood Washed Daily':[23,22,21],'Flood Washed Weekly':[26,25,24]},
  Roofed:{'Scraped Weekly':[29,27,25],'Scraped Monthly':[32,31,30],'Scraped Annually':[35,34,33],'Flood Washed Daily':[20,19,18],'Flood Washed Weekly':[23,22,21]},
  Enclosed:{'Scraped Weekly':[27,25,23],'Scraped Monthly':[30,29,28],'Scraped Annually':[33,32,31],'Flood Washed Daily':[17,16,15],'Flood Washed Weekly':[20,19,18]}};

// Receptor classes mapped to each method's own table value (overridable per receptor)
const RCLASS=[
  {k:'dwelling',l:'Single dwelling',vic:20,nat:0.3,w02:1,t1:250},
  {k:'two',l:'2 houses within 250 m',vic:20,nat:0.3,w02:1.5,t1:250},
  {k:'three',l:'3–4 houses within 250 m',vic:20,nat:0.7,w02:2,t1:250},
  {k:'rrgt1',l:'Rural living, lots over 1 ha',vic:40,nat:0.7,w02:3,t1:500},
  {k:'rrlt1',l:'Rural residential, lots under 1 ha',vic:40,nat:1.0,w02:3,t1:500},
  {k:'t10',l:'Township 10–30 people',vic:60,nat:0.6,w02:3,t1:750},
  {k:'t30',l:'Town 30–125 people',vic:60,nat:1.0,w02:3,t1:750},
  {k:'t125',l:'Town 125–500 people',vic:60,nat:1.1,w02:4,t1:750},
  {k:'t500',l:'Town 500–2,000 people',vic:60,nat:1.2,w02:4,t1:750},
  {k:'t2000',l:'Town over 2,000 people',vic:60,nat:1.6,w02:5,t1:750},
  {k:'school',l:'School or similar, outside town',vic:20,nat:0.3,w02:2,t1:250},
  {k:'hall',l:'Rural church or hall',vic:20,nat:0.2,w02:0.1,t1:250},
  {k:'pubhigh',l:'High-use public area',vic:20,nat:0.3,w02:3,t1:250},
  {k:'publow',l:'Low-use public area',vic:20,nat:0.05,w02:0.1,t1:250}];
const FCLASS=[
  {k:'waterway',l:'Waterway',min:100,rule:'Clause 53.AA AM4.1 — 100 m from a waterway'},
  {k:'drain',l:'Surface drain',min:60,rule:'Clause 53.AA AM4.1 — 60 m from a surface drain'},
  {k:'potable',l:'Potable water storage',min:800,rule:'Clause 53.AA AM4.2 — 800 m from a potable water storage'},
  {k:'bore',l:'Farm bore or spear point',min:200,rule:'2010 Vic feedpad guidelines — pond 200 m from farm bore'},
  {k:'channel',l:'Irrigation channel or drain',min:60,rule:'2010 Vic feedpad guidelines — pond 60 m from channel or drain'}];
const TERRAIN=[
  {k:'flat',l:'Flat (under 2% slope)',vic:1.0,nat:1.0,w02:1.0},
  {k:'undul',l:'Undulating, low relief between',vic:1.0,nat:0.9,w02:1.0},
  {k:'outside',l:'Downslope, outside sub-catchment',vic:1.0,nat:1.0,w02:1.0},
  {k:'downlow',l:'Downslope, low relief (over 2% fall)',vic:1.2,nat:1.2,w02:1.2},
  {k:'katab',l:'Katabatic drift area',vic:1.2,nat:1.2,w02:1.5},
  {k:'valley2',l:'Valley drainage, side slope under 2% (broad)',vic:1.2,nat:1.2,w02:1.2},
  {k:'valley25',l:'Valley drainage, side slope 2–5%',vic:1.5,nat:2.0,w02:2.0},
  {k:'valley5',l:'Valley drainage, side slope over 5%',vic:2.0,nat:2.0,w02:2.0},
  {k:'uphigh',l:'Receptor upslope, high relief (over 10%)',vic:1.0,nat:0.7,w02:0.7}];
const VEG=[
  {k:'crops',l:'Crops or short grazed pasture, few trees',vic:1.0,nat:1.0,w02:1.0},
  {k:'longgrass',l:'Permanent long grass (~1 m), scattered trees',vic:1.0,nat:0.9,w02:1.0},
  {k:'hills',l:'Undulating hills, minimal vegetation',vic:0.93,nat:1.0,w02:1.0},
  {k:'wooded',l:'Level wooded country / woodland',vic:0.85,nat:0.7,w02:0.9},
  {k:'timber',l:'Heavily timbered / open forest',vic:0.77,nat:0.6,w02:0.7},
  {k:'forest',l:'Forest with mid and lower storey',vic:0.77,nat:0.5,w02:0.7},
  {k:'hillsval',l:'Significant hills and valleys between',vic:0.68,nat:1.0,w02:1.0}];
const NAT_S5=[{k:'high',l:'High frequency toward receptor',v:1.5},{k:'normal',l:'Normal',v:1.0},{k:'low',l:'Low frequency (under 5%)',v:0.7}];

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>(n==null||!isFinite(n))?'—':Number(n).toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d});
const uid=p=>p+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>new Date().toISOString().slice(0,10);
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks.at(-1)]=v}
function interp(t,x){ // linear within table; outside → clamp, flagged

const calfCache=new Map();

  const key=JSON.stringify([c,calvings]);if(calfCache.has(key))return calfCache.get(key);

  const starts=[];for(let s=0;s<365*4;s+=Math.max(1,c.intervalDays))starts.push(s);
  const res={head:[],VIC23:[],NAT:[],W02:[]};
  const uf={};['VIC23','NAT','W02'].forEach(m=>{uf[m]=[];for(let a=0;a<days;a++){const lw=c.birthKg+(c.exitKg-c.birthKg)*a/days;uf[m].push(unitFactor(m,lw,false).v)}});
  for(let t=730;t<1095;t++){let h=0,u={VIC23:0,NAT:0,W02:0};

const RE=6371008.8,D2R=Math.PI/180;

function fromMap(r,siteId,sid){return!!(r.ll&&boundaryFor(siteId,sid))}
function distOf(r,siteId,sid){if(fromMap(r,siteId,sid)){const ref=geoRef();return Math.round(polyDist(toXY(r.ll,ref),boundaryFor(siteId,sid).map(p=>toXY(p,ref))))}const v=r.dist?.[siteId];return(v===''||v==null||!isFinite(+v))?null:+v}
function dirOf(r,siteId,sid){if(fromMap(r,siteId,sid)){const ref=geoRef();const c=centroidXY(boundaryFor(siteId,sid).map(p=>toXY(p,ref))),q=toXY(r.ll,ref);return Math.round(((Math.atan2(q[0]-c[0],q[1]-c[1])/D2R+360)%360)/22.5)%16}const v=r.dir?.[siteId];return(v==null||v==='')?null:+v}
function edgeSamples(A,step){const pts=[];for(let i=0;i<A.length;i++){const a=A[i],b=A[(i+1)%A.length];const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step));for(let k=0;k<n;k++)pts.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return pts}
function bufferRing(siteId,sid,m){const ring=boundaryFor(siteId,sid);if(!ring)return null;const D=reqByDir(siteId,sid,m);if(!D)return null;const ref=geoRef();const A=ring.map(p=>toXY(p,ref));const out=[];
  for(let t=0;t<360;t+=2){const u=[Math.sin(t*D2R),Math.cos(t*D2R)];let best=A[0],bv=-Infinity;for(const p of A){const v=p[0]*u[0]+p[1]*u[1];if(v>bv){bv=v;best=p}}const d=D[Math.round(t/22.5)%16];out.push(toLL([best[0]+d*u[0],best[1]+d*u[1]],ref))}return out}
function ownAuto(siteId,sid){const T=P.geo?.title,ring=boundaryFor(siteId,sid);if(!T||T.length<3||!ring)return null;const ref=geoRef();const A=ring.map(p=>toXY(p,ref)),TT=T.map(p=>toXY(p,ref)),c=centroidXY(A);

     ${sim?`<div class="row"><span>Peak <strong class="num">${fmt(sim.peakHead)}</strong> calves</span><span>Peak <strong class="num">${fmt(sim.peak.VIC23,1)}</strong> SDCU</span><span>Days empty per year <strong class="num">${fmt(sim.emptyDays)}</strong></span></div><div class="svgbox">${calfSVG(sim)}</div>`:''}</div>`}
  return`<div class="rcard"><div class="row" style="justify-content:space-between">${txt(`groups.${i}.name`,g.name,'gn-'+g.id)}<button class="btn small danger" data-act="delGroup" data-id="${g.id}">Remove</button></div>
   <div class="grid">${P.stages.map(s=>fld(`${g.calc?'Calvings per block':'Head'} — ${esc(s.name)}`,num(`groups.${i}.heads.${s.id}`,g.heads?.[s.id]??0,10))).join('')}

  const checks=[];
  if(st==='VIC'&&gateResult()==='grazing'){checks.push(['Clause 53.AA (Tier 1, notice exemption, 50% test)','na','Not applicable — grazing animal production. Distances above are a risk check.'])}
  else if(st==='VIC'){P.sites.forEach(si=>{const c=siteCalc(si.id,s.id,'VIC23');checks.push(['Vic Tier 1 threshold (90 SDCU)',c.N>90?'warn':'pass',c.N>90?`${fmt(c.N,1)} SDCU — Tier 2 required`:`${fmt(c.N,1)} SDCU — Tier 1 distances apply`]);
    const ne=noticeExempt(si.id,s.id);checks.push(['Notice and review exemption (53.AA-5.7)',ne.status,ne.status==='pass'?'Separation wholly within own boundary':ne.status==='fail'?'Separation extends past own boundary':'Own-boundary distances incomplete'])});
    P.receptors.filter(r=>r.kind!=='feat'&&!r.same).forEach(r=>{if(+r.propArea>0&&r.bufArea!==''&&r.bufArea!=null){const pc=100*(+r.bufArea)/(+r.propArea);checks.push([`50% neighbour test — ${r.name}`,pc<=50?'pass':'fail',`${fmt(pc)}% of property inside buffer`])}

   <div><div class="lbl">Herd ceiling</div>${ss.ceil?(ss.ceil.x.maxHead===0?`None — ${esc(ss.ceil.r.name)} is inside a fixed ${fmt(ss.ceil.x.minFixed)} m minimum, whatever the herd size`:`<span class="num">${fmt(ss.ceil.x.maxHead)}</span> head (limited by ${esc(ss.ceil.r.name)})`):'—'}</div></div>
   ${checks.length?`<div class="tw"><table><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>${checks.map(c=>`<tr><td>${esc(c[0])}</td><td>${pill(c[1],c[1]==='warn'?'NOTE':undefined)}</td><td>${esc(c[2])}</td></tr>`).join('')}</tbody></table></div>`:''}
   <div><div class="lbl">Approval triggers</div>${tr.t.map(t=>`<div>${pill(t[1],t[1]==='warn'?'Trigger':'Info')} ${esc(t[0])}</div>`).join('')}</div>

function exposureCard(){const w=P.wind;if(!w.bins)return`<section class="card"><div class="hd"><h2>Wind exposure</h2></div><div class="hint">Load an hourly wind file on the Wind step to see how often each receptor sits downwind.</div></section>`;

function roseSVG(l16){const tot=l16.reduce((a,b)=>a+b,0)||1,mx=Math.max(...l16)/tot||1,R=110,c=140;
  const wedges=l16.map((v,i)=>{const r=R*(v/tot)/mx,a0=(i*22.5-10)*Math.PI/180,a1=(i*22.5+10)*Math.PI/180;
    return`<path d="M${c} ${c}L${c+r*Math.sin(a0)} ${c-r*Math.cos(a0)}A${r} ${r} 0 0 1 ${c+r*Math.sin(a1)} ${c-r*Math.cos(a1)}Z" fill="var(--accent)" fill-opacity=".55" stroke="var(--accent)"/>`}).join('');
  return`<svg viewBox="0 0 280 290" role="img" aria-label="Light-wind rose" style="max-width:300px">${[.33,.66,1].map(k=>`<circle cx="${c}" cy="${c}" r="${R*k}" fill="none" stroke="var(--line)"/>`).join('')}${wedges}${DIRS.map((d,i)=>i%2?'':`<text x="${c+(R+16)*Math.sin(i*22.5*Math.PI/180)}" y="${c-(R+16)*Math.cos(i*22.5*Math.PI/180)+4}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${d}</text>`).join('')}<text x="${c}" y="284" text-anchor="middle" font-size="11" fill="var(--muted)">Wind blowing FROM — light winds</text></svg>`}
function calfSVG(sim){const W=560,H=120,pad=28,d=sim.series.head,n=d.length,mx=Math.max(...d)||1;const x=i=>pad+i*(W-pad*2)/(n-1),y=v=>H-20-(H-34)*v/mx;
  const path=d.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calves on hand through the year"><line x1="${pad}" x2="${W-pad}" y1="${H-20}" y2="${H-20}" stroke="var(--line)"/><path d="${path} L${x(n-1)} ${H-20} L${pad} ${H-20}Z" fill="var(--accent)" fill-opacity=".15"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="${pad}" y="12" font-size="11" fill="var(--muted)">Calves on hand through one year · peak ${fmt(sim.peakHead)}</text>${['Day 0','Day 120','Day 240','Day 365'].map((t,k)=>`<text x="${pad+k*(W-pad*2)/3}" y="${H-5}" font-size="10" fill="var(--muted)" text-anchor="${k===0?'start':k===3?'end':'middle'}">${t}</text>`).join('')}</svg>`}
function reqByDir(siteId,sid,m){const sc=siteCalc(siteId,sid,m);if(!sc.N)return null;const arr=vicS5Array(P.wind);

function diagramSVG(siteId,m){const S=520,c=S/2;const req=P.stages.map(s=>({s,d:reqByDir(siteId,s.id,m)}));const own=P.own[siteId]||{};
  const recs=P.receptors.filter(r=>distOf(r,siteId,STAGE_SEL)!=null&&dirOf(r,siteId,STAGE_SEL)!=null);
  const maxD=Math.max(100,...recs.map(r=>distOf(r,siteId,STAGE_SEL)),...req.flatMap(x=>x.d||[0]),...Object.values(own).filter(v=>v!==''&&v!=null).map(Number));
  const sc=(c-50)/(maxD*1.05);const pt=(d,i)=>[c+d*sc*Math.sin(i*22.5*Math.PI/180),c-d*sc*Math.cos(i*22.5*Math.PI/180)];
  const step=[100,200,250,500,1000,2000,2500,5000].find(v=>maxD/v<=5)||5000;const rings=[];for(let v=step;v<=maxD*1.05;v+=step)rings.push(v);
  const cols=['var(--muted)','var(--accent)','var(--warn)','var(--fail)'];
  const poly=d=>d.map((v,i)=>pt(v,i).map(n=>n.toFixed(1)).join(',')).join(' ');

  const sel=STAGE_SEL;
  return`<svg viewBox="0 0 ${S} ${S+40}" role="img" aria-label="Separation diagram for ${esc((P.sites.find(s=>s.id===siteId)||{}).name)}" style="max-width:${S}px" font-family="IBM Plex Sans,system-ui,sans-serif">

  ${DIRS.map((d,i)=>i%2?'':`<text x="${pt(maxD*1.1,i)[0]}" y="${pt(maxD*1.1,i)[1]+4}" text-anchor="middle" font-size="11" fill="var(--muted)">${d}</text>`).join('')}
  ${ownPts}${req.map((x,k)=>x.d?`<polygon points="${poly(x.d)}" fill="${cols[k%4]}" fill-opacity="${x.s.id===sel?.08:0}" stroke="${cols[k%4]}" stroke-width="${x.s.id===sel?2:1.2}"/>`:'').join('')}

    return`<g><circle cx="${x}" cy="${y}" r="${r.kind==='feat'?4:6}" fill="${col}" ${r.kind==='feat'?'':'stroke="var(--panel)" stroke-width="1.5"'}/><text x="${x+9}" y="${y+4}" font-size="11" fill="var(--ink)">${esc(r.name.split(' —')[0])}</text></g>`}).join('')}
  <g transform="translate(16 ${S+10})" font-size="11">${req.map((x,k)=>`<g transform="translate(${k*120} 0)"><rect width="14" height="3" y="6" fill="${cols[k%4]}"/><text x="20" y="12" fill="var(--ink)">${esc(x.s.name)}</text></g>`).join('')}${ownPts?`<g transform="translate(${req.length*120} 0)"><rect width="14" height="3" y="6" fill="var(--pass)"/><text x="20" y="12" fill="var(--ink)">Own boundary</text></g>`:''}</g>
  <text x="16" y="20" font-size="12" font-weight="600" fill="var(--ink)">${esc((P.sites.find(s=>s.id===siteId)||{}).name)} · ${esc(LIB[m].name)} · north up</text></svg>`}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===','||ch==='\t'||ch===';'){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}
function startImport(text){const rows=parseCSV(text);let hi=rows.findIndex(r=>r.some(c=>/[a-z]/i.test(c)));if(hi<0)hi=0;const head=rows[hi].map(h=>h.trim());const data=rows.slice(hi+1);
  const find=re=>head.findIndex(h=>re.test(h));const u=find(/^u10$|u10|u_component/i),v=find(/^v10$|v10|v_component/i);
  WIND_IMPORT={head,data,mode:u>-1&&v>-1?'uv':'sd',time:find(/time|date|hour/i),u,v,spd:find(/speed|wspd|^ws\b|spd/i),dir:find(/direction|wdir|^wd\b|dir/i),units:/km/i.test(head[find(/speed|wspd|spd/i)]||'')?'kmh':/kn|knot/i.test(head[find(/speed|wspd|spd/i)]||'')?'kn':'ms',offset:u>-1?10:0};render();}
function windMapUI(){const I=WIND_IMPORT;const sel=(k,label)=>fld(label,`<select id="wm-${k}" data-wm="${k}"><option value="-1">—</option>${I.head.map((h,i)=>`<option value="${i}" ${I[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select>`);
  return`<div class="rcard"><strong>${fmt(I.data.length)} rows read. Check the columns.</strong>
   ${fld('File type',chips('__wm.mode',[{k:'uv',l:'ERA5 u and v components'},{k:'sd',l:'Speed and direction'}],I.mode,false))}
   <div class="grid">${sel('time','Time column')}${I.mode==='uv'?sel('u','u (east) wind m/s')+sel('v','v (north) wind m/s'):sel('spd','Wind speed')+sel('dir','Direction (degrees from)')}</div>
   ${I.mode==='sd'?fld('Speed units',chips('__wm.units',[{k:'ms',l:'m/s'},{k:'kmh',l:'km/h'},{k:'kn',l:'knots'}],I.units,false)):''}
   ${fld('Hours to add to file times for local time (ERA5 is UTC: +10 for Vic standard time)',`<input id="wm-offset" data-wm="offset" inputmode="decimal" value="${I.offset}">`)}
   <div class="row"><button class="btn" data-act="windProcess">Build wind table</button><button class="btn ghost" data-act="windCancel">Cancel</button></div></div>`}
function processWind(){const I=WIND_IMPORT;const bins=new Array(360*9).fill(0);let hours=0,calm=0,noTime=0;
  for(const r of I.data){let s,d;if(I.mode==='uv'){const u=parseFloat(r[I.u]),v=parseFloat(r[I.v]);if(!isFinite(u)||!isFinite(v))continue;s=Math.hypot(u,v);d=(Math.atan2(-u,-v)*180/Math.PI+360)%360}
    else{s=parseFloat(r[I.spd]);d=parseFloat(r[I.dir]);if(!isFinite(s))continue;s=I.units==='kmh'?s/3.6:I.units==='kn'?s*0.5144:s}
    let h=null;const tm=String(r[I.time]??'').match(/(\d{1,2}):(\d{2})/);if(tm)h=((+tm[1]+(+I.offset||0))%24+24)%24;else noTime++;
    const tod=h==null?0:(h>=7&&h<17?0:(h>=17&&h<22?1:2));hours++;
    if(s<0.5||!isFinite(d)){calm++;continue}const sp=s<=3?0:(s<=6?1:2);bins[BIN(d,sp,tod)]++}
  if(!hours){toast('No usable rows — check the columns');return}
  P.wind=Object.assign(P.wind,{bins,hours,calm,source:I.mode==='uv'?'era5':'station',label:P.wind.label||(I.mode==='uv'?'ERA5 reanalysis hourly wind — screening':'Hourly station wind file')});
  WIND_IMPORT=null;save();render();toast(`${fmt(hours)} hours loaded${noTime?` · ${fmt(noTime)} rows without a time (counted as daytime)`:''}`)}

  if(el.dataset.alloc!=null){const g=P.groups[+el.dataset.alloc];g.alloc=g.alloc||[];const fid=el.dataset.fid;const a=g.alloc.find(a=>a.fid===fid);const v=+el.value||0;if(a)a.hrs=v;else g.alloc.push({fid,hrs:v});afterChange(false);return}
  if(el.dataset.wm){WIND_IMPORT[el.dataset.wm]=el.dataset.wm==='offset'?el.value:+el.value}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.ls){render();return}if(el.dataset.k||el.dataset.alloc!=null){render()}if(el.dataset.wm&&el.dataset.wm!=='offset'){WIND_IMPORT[el.dataset.wm]=+el.value}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;

    calfCache.clear();save();render();return}
  const act=b.dataset.act;if(!act)return;const id=b.dataset.id;const s0=P.sites[0].id;
  const A={
    addStage(){const n=P.stages.length+1;const id=uid('s');P.stages.push({id,name:'Stage '+n});P.groups.forEach(g=>{g.heads=g.heads||{};const prev=P.stages.at(-2);g.heads[id]=g.heads[prev.id]||0})},
    addStage0(){const id=uid('s');const first=P.stages[0];P.stages.unshift({id,name:'Stage 0 — existing operation'});P.groups.forEach(g=>{g.heads=g.heads||{};g.heads[id]=g.calc?0:(g.heads[first.id]||0)});toast('Stage 0 added — set "Built in" to Stage 0 for facilities that already exist')},
    delStage(){P.stages=P.stages.filter(s=>s.id!==id);P.facilities.forEach(f=>{if(f.built===id)f.built=P.stages[0].id;if(f.retired===id)f.retired=''})},
    addSite(){const sid=uid('S');P.sites.push({id:sid,name:'Site '+(P.sites.length+1),hasPond:false});P.own[sid]={}},
    delSite(){if(P.sites.length<2)return;P.sites=P.sites.filter(s=>s.id!==id);P.facilities.forEach(f=>{if(f.site===id)f.site=P.sites[0].id})},
    addFac(){P.facilities.push({id:uid('f'),name:'New facility',kind:'barn',site:s0,built:P.stages[0].id,retired:'',vicType:'shed_bed',area:0,w02Pad:'Enclosed',w02Clean:'Scraped Weekly'})},
    delFac(){P.facilities=P.facilities.filter(f=>f.id!==id);P.groups.forEach(g=>g.alloc=(g.alloc||[]).filter(a=>a.fid!==id))},
    addGroup(){P.groups.push({id:uid('g'),name:'Herd group',lw:600,lact:true,grazing:false,heads:Object.fromEntries(P.stages.map(s=>[s.id,0])),alloc:[],calc:null})},
    addCalf(){P.groups.push({id:uid('g'),name:'Calves 0–3 months',lw:75,lact:false,grazing:false,heads:Object.fromEntries(P.stages.map(s=>[s.id,0])),alloc:[],calc:{blocks:3,blockWeeks:6,intervalDays:122,reared:50,daysIn:91,birthKg:40,exitKg:110}})},
    delGroup(){P.groups=P.groups.filter(g=>g.id!==id)},
    addRec(){P.receptors.push({id:uid('r'),name:'New receptor',kind:'sens',cls:'dwelling',dist:{},dir:{},terrain:'flat',veg:'crops',same:false,ovr:{},notes:''})},
    addFeat(){P.receptors.push({id:uid('r'),name:'Waterway',kind:'feat',cls:'waterway',dist:{},dir:{},terrain:'flat',veg:'crops',same:false,ovr:{},notes:''})},
    delRec(){P.receptors=P.receptors.filter(r=>r.id!==id)},
    windRead(){const f=$('#windfile')?.files?.[0];if(f){const rd=new FileReader();rd.onload=()=>startImport(rd.result);rd.readAsText(f);return 'async'}const t=$('#windpaste')?.value;if(t&&t.trim())startImport(t);else toast('Choose a file or paste CSV text');return 'async'},
    windProcess(){processWind();return 'async'},windCancel(){WIND_IMPORT=null},
    windClear(){P.wind=Object.assign(P.wind,{bins:null,hours:0,calm:0,source:'none'})},
    newScen(){const s={id:uid('sc'),name:'Scenario '+String.fromCharCode(65+DOC.scenarios.length),data:clone(P)};DOC.scenarios.push(s);DOC.active=s.id;bindActive()},
    delScen(){CONFIRM='delScen'},delScenYes(){DOC.scenarios=DOC.scenarios.filter(s=>s.id!==DOC.active);DOC.active='base';bindActive();CONFIRM=null},cancel(){CONFIRM=null},
    saveFile(){(async()=>{const name=(P.project.name||'project').replace(/[^\w-]+/g,'_')+'.sfactor.json';
      if(canFS()){try{const h=FILE_HANDLE||await window.showSaveFilePicker({suggestedName:name,types:[{description:'S-factor project',accept:{'application/json':['.json']}}]});await writeHandle(h);FILE_HANDLE=h;PENDING_HANDLE=null;storeHandle(h);toast(`Saved to ${h.name} — autosave every ${AUTO_MIN} min is on`);renderAuto()}catch(e){if(e&&e.name!=='AbortError')toast('Save failed — '+e.message)}return}
      download(name,docJSON(),'application/json')})();return 'async'},
    saveAsFile(){FILE_HANDLE=null;A.saveFile();return 'async'},
    saveNow(){(async()=>{if(!FILE_HANDLE)return;try{await writeHandle(FILE_HANDLE);toast('Saved');renderAuto()}catch(e){toast('Save failed — '+e.message)}})();return 'async'},
    reconnect(){(async()=>{const h=PENDING_HANDLE;if(!h)return;try{if((await h.requestPermission({mode:'readwrite'}))==='granted'){FILE_HANDLE=h;PENDING_HANDLE=null;toast(`Autosave reconnected to ${h.name}`);renderAuto()}}catch(e){toast('Could not reconnect — use Save project file')}})();return 'async'},
    copyJSON(){copy(docJSON(),'Project text copied — paste into a file named project.sfactor.json');return 'async'},
    openFile(){(async()=>{try{const[h]=await window.showOpenFilePicker({types:[{description:'S-factor project',accept:{'application/json':['.json']}}]});const f=await h.getFile();loadDoc(await f.text());FILE_HANDLE=h;PENDING_HANDLE=null;DIRTY=false;storeHandle(h);renderAuto();toast(`Opened ${h.name} — autosave every ${AUTO_MIN} min is on`)}catch(e){if(e&&e.name!=='AbortError')toast('Could not open — '+e.message)}})();return 'async'},
    loadFile(){const f=$('#loadfile')?.files?.[0];if(!f){toast('Choose a project file');return 'async'}const rd=new FileReader();rd.onload=()=>loadDoc(rd.result);rd.readAsText(f);return 'async'},
    loadPaste(){const t=$('#loadpaste')?.value;if(t)loadDoc(t);return 'async'},

    doExample(){FILE_HANDLE=null;DOC={base:exampleProject(),scenarios:[],active:'base'};bindActive();CONFIRM=null;VIEW='project'},
    print(){try{window.print()}catch(_){}return 'async'},
    finishShape(){if(!DRAW||DRAW.pts.length<3){toast('Tap at least 3 corners first');return 'async'}setTarget(MAP_TARGET,DRAW.pts);DRAW=null;P.receptors.forEach(r=>{if(r.ll)syncPin(r)});if(MAP_TARGET==='parcel')toast('Parcel added')},

  if(A[act]){const r=A[act]();calfCache.clear();if(r!=='async'){save();render()}}

<script>
/* ---- installable app: service worker, install prompt, update prompt ---- */
(function(){
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;render()});
  addEventListener('appinstalled',()=>{INSTALL_EVT=null;render();toast('Installed — open S-Factor from your apps')});
  if(!('serviceWorker' in navigator)||!/^https:|^http:\/\/localhost/.test(location.href))return;
  addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){UPDATE_READY=w;render()}})};
      if(reg.waiting&&navigator.serviceWorker.controller){UPDATE_READY=reg.waiting;render()}
      reg.addEventListener('updatefound',()=>watch(reg.installing));
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
      let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;autosaveTick().finally(()=>location.reload())});
    }catch(e){}
  });
})();
</script>
